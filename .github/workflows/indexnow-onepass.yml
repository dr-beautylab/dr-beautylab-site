name: IndexNow 합격연구소 (빙에 알리기)

# 합격연구소는 클라우드플레어에 직접 올리는 사이트라, 새로 올린 뒤 이 작업을 수동으로 실행합니다.
on:
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 사이트맵 주소 전체를 빙에 알리기
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          host = "onepass.drbeautylab.co.kr"; key = "e9b15b4779e64123f42df0b2ad4f56db"
          sm = urllib.request.urlopen(f"https://{host}/sitemap.xml", timeout=30).read().decode()
          urls = re.findall(r"<loc>\s*([^<\s]+)\s*</loc>", sm)
          body = json.dumps({"host": host, "key": key, "keyLocation": f"https://{host}/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body, headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              r = urllib.request.urlopen(req, timeout=30); print("IndexNow 응답", r.status, "주소", len(urls))
          except urllib.error.HTTPError as e:
              print("IndexNow 오류", e.code, e.read()[:300])
          PY
